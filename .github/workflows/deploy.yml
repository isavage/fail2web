name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod-IN'
        type: choice
        options:
        - prod-IN
        - prod-NL
      cleanup:
        description: 'Clean up persistent directories before deploying'
        required: false
        type: boolean
        default: false
      use_git_deployment:
        description: 'Dev - git based deployment'
        required: false
        type: boolean
        default: false
      

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git operations

      - name: Upload files to temporary directory on VPS (SCP mode)
        if: ${{ github.event.inputs.use_git_deployment != 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: ".,!.git*,!.github*,!.gitignore,!.env"
          target: "/tmp/fail2web-deploy-temp"
          strip_components: 0
          overwrite: true

      - name: Cleanup (if needed), move files, and finalize deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DOPPLER_TOKEN
          script: |
            set -e

            if [ -z "${DOPPLER_TOKEN:-}" ]; then
              echo "❌ DOPPLER_TOKEN is not configured for this GitHub environment"
              exit 1
            fi

            # Determine target directory based on deployment mode
            USE_GIT="${{ github.event.inputs.use_git_deployment }}"
            if [[ "$USE_GIT" == "true" ]]; then
              TARGET_DIR="/docker/fail2web_dev"
              echo "🔧 Dev mode: using $TARGET_DIR directory"
            else
              TARGET_DIR="/docker/fail2web"
              echo "🔧 Prod mode: using $TARGET_DIR directory"
            fi
            
            TEMP_DIR="/tmp/fail2web-deploy-temp"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            # Extract branch name from ref (e.g., refs/heads/main -> main)
            CURRENT_BRANCH="${{ github.ref }}"
            CURRENT_BRANCH="${CURRENT_BRANCH#refs/heads/}"

            # Stop any running containers from the OTHER directory first
            PROD_DIR="/docker/fail2web"
            if [ -d "$PROD_DIR" ] && [ -f "$PROD_DIR/docker-compose.yml" ]; then
                echo "🛑 Stopping prod containers in $PROD_DIR..."
                cd "$PROD_DIR" && doppler run -- docker compose down 2>/dev/null || true
            fi
            DEV_DIR="/docker/fail2web_dev"
            if [ -d "$DEV_DIR" ] && [ -f "$DEV_DIR/docker-compose.yml" ]; then
                echo "🛑 Stopping dev containers in $DEV_DIR..."
                cd "$DEV_DIR" && doppler run -- docker compose down 2>/dev/null || true
            fi

            # Ensure target exists
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            if [[ "$USE_GIT" == "true" ]]; then
              echo "🔧 Git-based deployment mode"
              
              # Clean up target directory for fresh git clone
              echo "🧹 Cleaning up $TARGET_DIR for fresh git clone..."
              # Remove all files and directories except . (current directory)
              find . -mindepth 1 -type f -delete 2>/dev/null || true
              find . -mindepth 1 -type d -empty -delete 2>/dev/null || true
              find . -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true

              # NEW: Explicitly remove the entire fail2ban/data directory for full reset
              if [ -d fail2ban/data ]; then
                  echo "🗑️ Removing persistent Fail2ban data (bans DB + custom jails/filters)"
                  sudo rm -rf fail2ban/data
              fi
              
              # Clone fresh repository
              echo "📦 Cloning repository..."
              git clone --branch "$CURRENT_BRANCH" "$REPO_URL" .
              
            else
              echo "🔧 Standard SCP deployment mode"
              
              # Backup .env before cleanup (if requested)
              if [[ "${{ github.event.inputs.cleanup }}" == "true" ]]; then
                echo "🧹 Cleanup requested for prod deployment - removing ALL files including fail2ban data"
                # NEW: Explicitly remove the entire fail2ban/data directory for full reset
                if [ -d fail2ban/data ]; then
                  echo "🗑️ Removing persistent Fail2ban data (bans DB + custom jails/filters)"
                  sudo rm -rf fail2ban/data
                fi
              
                # Clean up ALL files including fail2ban/data
                # First, remove all files except backups
                find . -mindepth 1 -not -path './*.backup' -type f -delete 2>/dev/null || true
                # Then remove empty directories
                find . -mindepth 1 -not -path './*.backup' -type d -empty -delete 2>/dev/null || true
                # Finally, force remove any remaining directories (including fail2ban/data)
                find . -mindepth 1 -not -path './*.backup' -type d -exec rm -rf {} + 2>/dev/null || true
              fi
              
              # Move files from temp to target (fast, atomic-ish)
              echo "🚚 Moving new files to $TARGET_DIR..."
              rsync -av --no-perms --no-owner --no-group --exclude='.env' "$TEMP_DIR"/. ./

              # Clean up temp directory
              rm -rf "$TEMP_DIR"
              
            fi

            # Runtime configuration comes from Doppler. Never persist it on the VPS.
            if ! command -v doppler >/dev/null 2>&1; then
              echo "📦 Installing Doppler CLI..."
              curl -Ls https://cli.doppler.com/install.sh | sudo sh
            fi
            rm -f .env .env.backup .env.doppler

            # Set permissions
            chmod -R 750 . 2>/dev/null || true

            # Validate
            if [ ! -f docker-compose.yml ]; then
              echo "❌ docker-compose.yml missing!"
              exit 1
            fi

            # Validate required variables without writing them to disk.
            doppler run -- sh -c 'for var in FAIL2WEB_USERNAME FAIL2WEB_PASSWORD FAIL2WEB_SECRET_KEY TZ EXTRA_HOST; do
              eval "value=\${$var:-}"
              [ -n "$value" ] || { echo "❌ Missing $var in Doppler configuration"; exit 1; }
            done'
            echo "✅ Doppler configuration validated"

            # Restart services
            echo "🚀 Restarting services..."
            doppler run -- docker compose down || true
            doppler run -- docker compose up -d --build

            # Wait for services to start
            echo "⏳ Waiting for services to start..."
            sleep 10

            # Verify services are running
            if ! doppler run -- docker compose ps | grep -q "Up"; then
              echo "❌ Services failed to start!"
              doppler run -- docker compose logs
              exit 1
            fi
            echo "✅ Services running"

            if [[ "$USE_GIT" == "true" ]]; then
              echo "🎉 Dev deployment completed successfully in $TARGET_DIR!"
              echo "💡 For future changes:"
              echo "   1. Push changes to GitHub"
              echo "   2. On VPS: cd /docker/fail2web_dev && git pull"
              echo "   3. On VPS: docker compose up -d --build"
            else
              echo "🎉 Prod deployment completed successfully in $TARGET_DIR!"
            fi
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
